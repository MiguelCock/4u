name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------
  # 1. Detect changes and build a dynamic matrix
  # ----------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      packages: ${{ steps.filter.outputs.packages }}
      e2e: ${{ steps.filter.outputs.e2e }}
      workflows: ${{ steps.filter.outputs.workflows }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'application/**'
            packages:
              - 'packages/**'
            loadtest:
              - 'loadtest/**'
            backend-data-collection:
              - 'backend-data-collection/**'
              - 'packages/**'
            backend-map-management:
              - 'backend-map-management/**'
              - 'packages/**'
            backend-route-management:
              - 'backend-route-management/**'
              - 'packages/**'
            backend-user-management:
              - 'backend-user-management/**'
              - 'packages/**'
            backend-navigation-management:
              - 'backend-navigation-management/**'
              - 'packages/**'
            backend-ai-training:
              - 'backend-ai-training/**'
              - 'packages/**'
            backend-positioning:
              - 'backend-positioning/**'
              - 'packages/**'
            workflows:
              - '.github/workflows/**'
            # The behavior suite runs for anything the system's behavior
            # depends on. Not in the matrix below: it needs the whole stack.
            e2e:
              - 'backend-*/**'
              - 'packages/**'
              - 'gateway/**'
              - 'db_schema/**'
              - 'e2e/**'
              - 'supabase/**'
              - 'docker-compose.yml'
              - 'docker-compose.e2e.yml'
              - 'scripts/e2e*.sh'
            # Add more services here

      - name: Build matrix
        id: set-matrix
        env:
          FILTER_OUTPUTS: ${{ toJSON(steps.filter.outputs) }}
        run: |
          components=(
            '{"name":"app","path":"application","language":"flutter","test_cmd":"flutter test"}'
            '{"name":"packages","path":"packages","language":"python","test_cmd":"pytest"}'
            '{"name":"loadtest","path":"loadtest","language":"python","test_cmd":"pytest"}'
            '{"name":"backend-data-collection","path":"backend-data-collection","language":"python","test_cmd":"pytest"}'
            '{"name":"backend-map-management","path":"backend-map-management","language":"python","test_cmd":"pytest"}'
            '{"name":"backend-route-management","path":"backend-route-management","language":"python","test_cmd":"pytest"}'
            '{"name":"backend-user-management","path":"backend-user-management","language":"python","test_cmd":"pytest"}'
            '{"name":"backend-navigation-management","path":"backend-navigation-management","language":"python","test_cmd":"pytest"}'
            '{"name":"backend-ai-training","path":"backend-ai-training","language":"python","test_cmd":"pytest"}'
            '{"name":"backend-positioning","path":"backend-positioning","language":"python","test_cmd":"pytest"}'
          )
          workflows_changed=$(echo "$FILTER_OUTPUTS" | jq -r '.workflows // "false"')
          matrix='[]'
          for comp in "${components[@]}"; do
            name=$(echo "$comp" | jq -r '.name')
            changed=$(echo "$FILTER_OUTPUTS" | jq -r --arg n "$name" '.[$n] // "false"')
            if [ "$changed" == "true" ] || [ "$workflows_changed" == "true" ]; then
              matrix=$(echo "$matrix" | jq -c --argjson c "$comp" '. += [$c]')
            fi
          done
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  # ----------------------------------------------------------------------
  # 2. Run tests for changed components
  # ----------------------------------------------------------------------
  test:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      # Setup Flutter
      - name: Setup Flutter
        if: matrix.language == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # Setup Python
      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # --- Python dependencies with uv ---
      - name: Install uv
        if: matrix.language == 'python'
        run: pip install uv

      - name: Install Python dependencies with uv
        if: matrix.language == 'python'
        run: |
          cd ${{ matrix.path }}
          # If pyproject.toml exists, use uv sync (creates .venv)
          if [ -f "pyproject.toml" ]; then
            uv sync
          else
            # Otherwise install from requirements.txt (if it exists)
            if [ -f "requirements.txt" ]; then
              uv pip install -r requirements.txt
            fi
            # Ensure pytest is installed
            uv pip install pytest
          fi
        env:
          UV_SYSTEM_PYTHON: true  # Use the Python from setup-python

      # Flutter dependencies
      - name: Install Flutter dependencies
        if: matrix.language == 'flutter'
        run: |
          cd ${{ matrix.path }}
          # pubspec.yaml declares .env as an asset (flutter_dotenv); a dummy
          # copy of .env.example satisfies asset bundling for CI/tests, no
          # real credentials needed since nothing here calls a live backend.
          cp .env.example .env
          flutter pub get

      # --- Run tests ---
      - name: Run tests
        env:
          # Only packages/tests/test_supabase.py and test_qdrant.py read these -
          # live connectivity checks against the real services, skipped if unset.
          # Harmless no-op for every other component.
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_KEY: ${{ secrets.QDRANT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cd ${{ matrix.path }}
          if [ "${{ matrix.language }}" == "python" ]; then
            # Use uv run to ensure we use the virtual environment
            uv run ${{ matrix.test_cmd }}
          else
            ${{ matrix.test_cmd }}
          fi

      # --- Run lint ---
      - name: Run lint
        run: |
          cd ${{ matrix.path }}
          if [ "${{ matrix.language }}" == "python" ]; then
            uv run ruff check .
          else
            dart format --output=none --set-exit-if-changed .
            flutter analyze
          fi

  # ----------------------------------------------------------------------
  # 3. Boot the full docker-compose stack and prove the gateway routes to
  #    every service. Fake-but-valid-looking .env values are enough - each
  #    service's root `GET /` handler never touches Supabase/Qdrant, but
  #    supabase-py's create_client() validates the URL *format* eagerly at
  #    import time (raises on anything not matching http(s)://...), so the
  #    literal `.env.example` placeholder text isn't enough on its own.
  # ----------------------------------------------------------------------
  # The admin guide's web page is committed, built from docs/admin-guide/.
  admin-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: The page matches its Markdown and images
        run: uv run --no-project --python 3.14 --with markdown==3.11.2 python docs/admin-guide/tools/build_site.py --check

  # ----------------------------------------------------------------------
  # Behavior suite (E3, e2e/README.md): the whole system on Supabase's local
  # stack, a local Qdrant and all services, through the gateway like the app.
  # Never touches production.
  # ----------------------------------------------------------------------
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        run: pip install uv

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Run the behavior suite
        run: scripts/e2e.sh -v

      - name: Service logs (on failure)
        if: failure()
        run: E2E_SERVICE_ROLE_KEY=unused docker compose -p eyes4u-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs --tail 200

      - name: Stop everything
        if: always()
        run: scripts/e2e.sh down

  gateway-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create placeholder .env files
        run: |
          # supabase-py's create_client validates SUPABASE_URL is a real
          # http(s) URL at construction time (raises otherwise) - every
          # service builds its client eagerly at import, so a literal
          # `.env.example` placeholder like `<SUBSTITUTE_SUPABASE_URL>`
          # crashes the whole app before it can start listening.
          for d in backend-data-collection backend-map-management backend-route-management backend-user-management backend-navigation-management; do
            {
              echo "SUPABASE_URL=https://example.supabase.co"
              echo "SUPABASE_SERVICE_ROLE_KEY=placeholder-key"
              echo "QDRANT_URL=https://example.qdrant.io"
              echo "QDRANT_KEY=placeholder-key"
            } > "$d/.env"
          done
          # backend-ai-training now also needs Supabase (as of #24 - to
          # verify caller bearer tokens / admin role on the write endpoints;
          # it still never queries Postgres for anything else).
          {
            echo "SUPABASE_URL=https://example.supabase.co"
            echo "SUPABASE_SERVICE_ROLE_KEY=placeholder-key"
            echo "QDRANT_URL=https://example.qdrant.io"
            echo "QDRANT_KEY=placeholder-key"
          } > backend-ai-training/.env
          # backend-positioning now also needs Supabase (app-integration
          # follow-up to #24 - only to verify caller bearer tokens on
          # POST /correct_position). AI_TRAINING_URL's real default already
          # points at the right Docker Compose service name.
          {
            echo "AI_TRAINING_URL=http://ai-training:80"
            echo "SUPABASE_URL=https://example.supabase.co"
            echo "SUPABASE_SERVICE_ROLE_KEY=placeholder-key"
          } > backend-positioning/.env
          # Photo search's own Qdrant (E2).
          echo "QDRANT__SERVICE__API_KEY=placeholder-key" > qdrant/.env

      - name: docker compose up
        run: docker compose up --build -d

      - name: Curl every service through the gateway (with retries)
        run: |
          # The gateway itself (nginx) is ready almost instantly, but the
          # FastAPI containers behind it take a few seconds to start
          # accepting connections - retry the real per-service routes,
          # not just the gateway's own static root.
          for prefix in data-collection map route user navigation ai-training positioning; do
            echo "== /$prefix/ =="
            ok=""
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:8000/$prefix/" | tee /tmp/resp | grep -q '"status":"ok"'; then
                cat /tmp/resp
                ok=1
                break
              fi
              sleep 1
            done
            if [ -z "$ok" ]; then
              echo "FAILED: /$prefix/ never returned status ok"
              docker compose logs
              exit 1
            fi
          done

      - name: The admin guide is served, not the app in its place
        run: |
          # /admin/ falls back to the app's index.html for unknown paths, which
          # would hide a guide that didn't reach the server behind a 200.
          mkdir -p gateway/admin-web/guide/es
          echo 'the app' > gateway/admin-web/index.html
          echo 'the guide' > gateway/admin-web/guide/es/index.html
          curl -s http://localhost:8000/admin/guide/es/ | grep -q 'the guide' \
            || { echo "FAILED: /admin/guide/es/ doesn't serve the guide"; exit 1; }

      - name: The admin app is never served from an old cache
        run: |
          # Every load revalidates, and a leftover service worker retires
          # itself (an old one kept serving a stale app after a deploy).
          curl -sI http://localhost:8000/admin/ | grep -qi '^cache-control: no-cache' \
            || { echo "FAILED: /admin/ isn't sent with Cache-Control: no-cache"; exit 1; }
          curl -s http://localhost:8000/admin/flutter_service_worker.js | grep -q 'unregister' \
            || { echo "FAILED: /admin/flutter_service_worker.js isn't the kill switch"; exit 1; }
          grep -q 'serviceWorker' application/web/flutter_bootstrap.js \
            && { echo "FAILED: the web app registers a service worker again"; exit 1; } || true

      - name: Internal-only and size rules hold at the gateway
        run: |
          # Photo search is internal (positioning -> ai-training direct).
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/ai-training/search_similar)
          echo "search_similar via gateway: $code"
          [ "$code" = "404" ] || { echo "FAILED: search_similar is reachable through the gateway"; exit 1; }
          # A 2 MB upload must reach the service (nginx's default 1 MB cap
          # answers 413 before it does).
          head -c 2000000 /dev/urandom > /tmp/big.jpg
          code=$(curl -s -o /dev/null -w "%{http_code}" -F "file=@/tmp/big.jpg" http://localhost:8000/map/anchor-points/upload-image)
          echo "2 MB upload via gateway: $code"
          [ "$code" != "413" ] || { echo "FAILED: gateway refused a 2 MB upload"; exit 1; }
          # Rate limiting: one client's burst well past 30 r/s (+60) gets
          # 429s, while a single request after a pause still passes.
          codes=$(seq 1 200 | xargs -P 40 -I{} curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8000/map/ | sort | uniq -c)
          echo "$codes"
          echo "$codes" | grep -q " 429" || { echo "FAILED: no rate limiting"; exit 1; }
          sleep 3
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/map/)
          [ "$code" = "200" ] || { echo "FAILED: still limited after a pause ($code)"; exit 1; }

      - name: docker compose logs (always, for debugging)
        if: always()
        run: docker compose logs

      - name: docker compose down
        if: always()
        run: docker compose down -v