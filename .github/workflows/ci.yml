name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------
  # 1. Detect changes and build a dynamic matrix
  # ----------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      packages: ${{ steps.filter.outputs.packages }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'application/**'
            packages:
              - 'packages/**'
            backend-data-collection:
              - 'backend-data-collection/**'
            backend-map-management:
              - 'backend-map-management/**'
            backend-route-management:
              - 'backend-route-management/**'
            backend-user-management:
              - 'backend-user-management/**'
            backend-navigation-management:
              - 'backend-navigation-management/**'
            backend-ai-training:
              - 'backend-ai-training/**'
            workflows:
              - '.github/workflows/**'
            # Add more services here

      - name: Build matrix
        id: set-matrix
        env:
          FILTER_OUTPUTS: ${{ toJSON(steps.filter.outputs) }}
        run: |
          components=(
            '{"name":"app","path":"application","language":"flutter","test_cmd":"flutter test"}'
            '{"name":"packages","path":"packages","language":"python","test_cmd":"pytest"}'
            '{"name":"backend-data-collection","path":"backend-data-collection","language":"python","test_cmd":"pytest"}'
            '{"name":"backend-map-management","path":"backend-map-management","language":"python","test_cmd":"pytest"}'
            '{"name":"backend-route-management","path":"backend-route-management","language":"python","test_cmd":"pytest"}'
            '{"name":"backend-user-management","path":"backend-user-management","language":"python","test_cmd":"pytest"}'
            '{"name":"backend-navigation-management","path":"backend-navigation-management","language":"python","test_cmd":"pytest"}'
            '{"name":"backend-ai-training","path":"backend-ai-training","language":"python","test_cmd":"pytest"}'
          )
          workflows_changed=$(echo "$FILTER_OUTPUTS" | jq -r '.workflows // "false"')
          matrix='[]'
          for comp in "${components[@]}"; do
            name=$(echo "$comp" | jq -r '.name')
            changed=$(echo "$FILTER_OUTPUTS" | jq -r --arg n "$name" '.[$n] // "false"')
            if [ "$changed" == "true" ] || [ "$workflows_changed" == "true" ]; then
              matrix=$(echo "$matrix" | jq -c --argjson c "$comp" '. += [$c]')
            fi
          done
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  # ----------------------------------------------------------------------
  # 2. Run tests for changed components
  # ----------------------------------------------------------------------
  test:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      # Setup Flutter
      - name: Setup Flutter
        if: matrix.language == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # Setup Python
      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # --- Python dependencies with uv ---
      - name: Install uv
        if: matrix.language == 'python'
        run: pip install uv

      - name: Install Python dependencies with uv
        if: matrix.language == 'python'
        run: |
          cd ${{ matrix.path }}
          # If pyproject.toml exists, use uv sync (creates .venv)
          if [ -f "pyproject.toml" ]; then
            uv sync
          else
            # Otherwise install from requirements.txt (if it exists)
            if [ -f "requirements.txt" ]; then
              uv pip install -r requirements.txt
            fi
            # Ensure pytest is installed
            uv pip install pytest
          fi
        env:
          UV_SYSTEM_PYTHON: true  # Use the Python from setup-python

      # Flutter dependencies
      - name: Install Flutter dependencies
        if: matrix.language == 'flutter'
        run: |
          cd ${{ matrix.path }}
          # pubspec.yaml declares .env as an asset (flutter_dotenv); a dummy
          # copy of .env.example satisfies asset bundling for CI/tests, no
          # real credentials needed since nothing here calls a live backend.
          cp .env.example .env
          flutter pub get

      # --- Run tests ---
      - name: Run tests
        env:
          # Only packages/tests/test_supabase.py and test_qdrant.py read these -
          # live connectivity checks against the real services, skipped if unset.
          # Harmless no-op for every other component.
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_KEY: ${{ secrets.QDRANT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cd ${{ matrix.path }}
          if [ "${{ matrix.language }}" == "python" ]; then
            # Use uv run to ensure we use the virtual environment
            uv run ${{ matrix.test_cmd }}
          else
            ${{ matrix.test_cmd }}
          fi

      # --- Run lint ---
      - name: Run lint
        run: |
          cd ${{ matrix.path }}
          if [ "${{ matrix.language }}" == "python" ]; then
            uv run ruff check .
          else
            dart format --output=none --set-exit-if-changed .
            flutter analyze
          fi

  # ----------------------------------------------------------------------
  # 3. Boot the full docker-compose stack and prove the gateway routes to
  #    every service. Fake-but-valid-looking .env values are enough - each
  #    service's root `GET /` handler never touches Supabase/Qdrant, but
  #    supabase-py's create_client() validates the URL *format* eagerly at
  #    import time (raises on anything not matching http(s)://...), so the
  #    literal `.env.example` placeholder text isn't enough on its own.
  # ----------------------------------------------------------------------
  gateway-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create placeholder .env files
        run: |
          # supabase-py's create_client validates SUPABASE_URL is a real
          # http(s) URL at construction time (raises otherwise) - every
          # service builds its client eagerly at import, so a literal
          # `.env.example` placeholder like `<SUBSTITUTE_SUPABASE_URL>`
          # crashes the whole app before it can start listening.
          for d in backend-data-collection backend-map-management backend-route-management backend-user-management backend-navigation-management; do
            {
              echo "SUPABASE_URL=https://example.supabase.co"
              echo "SUPABASE_SERVICE_ROLE_KEY=placeholder-key"
              echo "QDRANT_URL=https://example.qdrant.io"
              echo "QDRANT_KEY=placeholder-key"
            } > "$d/.env"
          done
          # backend-ai-training only reads the Qdrant vars (no Supabase
          # access - see its CLAUDE.md), but writing all four is harmless.
          {
            echo "QDRANT_URL=https://example.qdrant.io"
            echo "QDRANT_KEY=placeholder-key"
          } > backend-ai-training/.env

      - name: docker compose up
        run: docker compose up --build -d

      - name: Curl every service through the gateway (with retries)
        run: |
          # The gateway itself (nginx) is ready almost instantly, but the
          # FastAPI containers behind it take a few seconds to start
          # accepting connections - retry the real per-service routes,
          # not just the gateway's own static root.
          for prefix in data-collection map route user navigation ai-training; do
            echo "== /$prefix/ =="
            ok=""
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:8000/$prefix/" | tee /tmp/resp | grep -q '"status":"ok"'; then
                cat /tmp/resp
                ok=1
                break
              fi
              sleep 1
            done
            if [ -z "$ok" ]; then
              echo "FAILED: /$prefix/ never returned status ok"
              docker compose logs
              exit 1
            fi
          done

      - name: docker compose logs (always, for debugging)
        if: always()
        run: docker compose logs

      - name: docker compose down
        if: always()
        run: docker compose down -v