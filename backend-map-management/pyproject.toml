[project]
name = "backend-map-management"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "packages",
    "python-dotenv>=1.2.3",
]

[tool.uv.sources]
packages = { path = "../packages", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff.lint.flake8-bugbear]
# `File(...)` as a default is FastAPI's standard DI pattern, not a real
# mutable-default bug (B008) - ruff only exempts `fastapi.Depends` by default.
extend-immutable-calls = ["fastapi.File"]
