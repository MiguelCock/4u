[project]
name = "backend-ai-training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MiguelCock", email = "maiguec999@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "opencv-python-headless>=5.0.0.93",
    "packages",
    "pillow>=12.0.0",
    "python-dotenv>=1.2.3",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[tool.uv.sources]
packages = { path = "../packages", editable = true }
torch = [
  { index = "pytorch-cpu" },
]
torchvision = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff.lint.flake8-bugbear]
# `File(...)`/`Form(...)` as defaults are FastAPI's standard DI pattern, not a
# real mutable-default bug (B008) - ruff only exempts `fastapi.Depends` by default.
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
