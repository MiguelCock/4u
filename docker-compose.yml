services:
  data-collection:
    build:
      context: .
      dockerfile: backend-data-collection/Dockerfile
    env_file:
      - backend-data-collection/.env
    restart: unless-stopped

  map-management:
    build:
      context: .
      dockerfile: backend-map-management/Dockerfile
    env_file:
      - backend-map-management/.env
    restart: unless-stopped

  route-management:
    build:
      context: .
      dockerfile: backend-route-management/Dockerfile
    env_file:
      - backend-route-management/.env
    restart: unless-stopped

  user-management:
    build:
      context: .
      dockerfile: backend-user-management/Dockerfile
    env_file:
      - backend-user-management/.env
    restart: unless-stopped

  navigation-management:
    build:
      context: .
      dockerfile: backend-navigation-management/Dockerfile
    env_file:
      - backend-navigation-management/.env
    restart: unless-stopped

  ai-training:
    build:
      context: .
      dockerfile: backend-ai-training/Dockerfile
    env_file:
      - backend-ai-training/.env
    # Overloaded, this one used up the machine's memory and froze everything
    # until a reboot (docs/loadtest/baseline.md). With a limit it's the only
    # thing that restarts. No swap, because the disk is what got overwhelmed.
    mem_limit: 1800m
    memswap_limit: 1800m
    restart: unless-stopped

  # Photo search's vectors, next to ai-training (E2). Qdrant Cloud was in
  # Sao Paulo while this machine is in Virginia: 344 ms of every photo's 873 ms
  # (docs/loadtest/e2-results.md). ai-training uses it when its QDRANT_URL is
  # http://qdrant:6333. Everything in it can be rebuilt from the database with
  # the admin "Re-index verified points".
  qdrant:
    image: qdrant/qdrant:v1.13.6
    env_file:
      - qdrant/.env
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      # The model machines reach it on the private address (QDRANT_BIND, in
      # the server's ~/4u/.env); never on a public one.
      - "${QDRANT_BIND:-127.0.0.1}:6333:6333"
    restart: unless-stopped

  # Fuses GPS + a visual anchor-point match (from ai-training) into a
  # corrected position (#31-34). No Supabase/Qdrant credentials of its own
  # (see backend-positioning/CLAUDE.md) - env_file still needs to exist
  # because compose errors on a referenced file that's missing, even with
  # nothing secret in it.
  positioning:
    build:
      context: .
      dockerfile: backend-positioning/Dockerfile
    env_file:
      - backend-positioning/.env
    depends_on:
      - ai-training
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "0.0.0.0:8000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      # The admin web app's build (see docs/SETUP.md); empty until built.
      - ./gateway/admin-web:/usr/share/nginx/admin:ro
    depends_on:
      - data-collection
      - map-management
      - route-management
      - user-management
      - navigation-management
      - ai-training
      - positioning
    restart: unless-stopped

  # TLS termination for the Phase 1 EC2 deployment (#92) - reverse-proxies to
  # the plain-HTTP `gateway` above and gets free, fully-automatic Let's
  # Encrypt HTTPS. Gated behind the "https" profile so plain `docker compose
  # up` (CI, local dev) never starts it - it only runs when COMPOSE_PROFILES
  # includes "https" (set in deployment/phase1-ec2/.env, synced to the EC2
  # instance's own .env by the deploy step - see that README).
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  qdrant_data:
