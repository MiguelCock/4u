name: eyes4u
description: "GPS positioning correction app for assisted navigation of visually impaired users on university campuses."
publish_to: 'none'
version: 0.34.0+1

environment:
  sdk: ^3.12.2

dependencies:
  camera: ^0.12.0+2
  flutter:
    sdk: flutter
  flutter_compass: ^0.8.1
  flutter_dotenv: ^5.2.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.0
  flutter_tts: ^4.2.3
  geolocator: ^14.0.3
  http: ^1.6.0
  http_parser: ^4.1.2
  intl: ^0.20.2
  latlong2: ^0.10.1
  path: ^1.9.1
  permission_handler: ^13.0.0
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
