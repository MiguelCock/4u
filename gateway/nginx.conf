events {}

http {
  # For the admin web app's files (.js, .wasm, .json...) under /admin/.
  include /etc/nginx/mime.types;

  # nginx's own "combined" format, which loadtest/ parses, plus how long each
  # request took (rt) and how long the service behind it took (urt), in
  # seconds: E2 measures what users wait for from these.
  log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                   'rt=$request_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log timed;

  # Photo uploads (anchor photos, navigation frames) - nginx's default 1 MB
  # would refuse anything above a medium-resolution camera frame.
  client_max_body_size 15m;

  # Rate limits. Two keys per route:
  # - per user: the bearer token (each signed-in phone has its own), or the
  #   address for requests without one. Navigation sends ~1 photo and ~1 log
  #   per second, well under these.
  # - per address, much higher: a whole campus Wi-Fi leaves through one
  #   public address, so dozens of users there must fit, while a single
  #   address still can't flood the server by inventing tokens.
  # Caddy (TLS) sits in front and forwards the real address in
  # X-Forwarded-For; trust it only from the Docker networks.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  map $http_authorization $user_key {
    ""      $binary_remote_addr;
    default $http_authorization;
  }
  limit_req_zone $user_key zone=general:20m rate=30r/s;
  limit_req_zone $user_key zone=positioning:20m rate=5r/s;
  limit_req_zone $user_key zone=uploads:20m rate=2r/s;
  limit_req_zone $binary_remote_addr zone=general_ip:10m rate=300r/s;
  limit_req_zone $binary_remote_addr zone=positioning_ip:10m rate=60r/s;
  limit_req_zone $binary_remote_addr zone=uploads_ip:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=static:10m rate=100r/s;
  limit_req_status 429;

  server {
    listen 80;

    # Every API route unless a location below sets its own.
    limit_req zone=general burst=60 nodelay;
    limit_req zone=general_ip burst=600 nodelay;

    location = / {
      default_type application/json;
      return 200 '{"gateway":"ok"}';
    }

    location /data-collection/ {
      rewrite ^/data-collection/(.*)$ /$1 break;
      proxy_pass http://data-collection:80;
    }

    # Photo uploads: the heaviest requests, kept to a few per second.
    location = /map/anchor-points/upload-image {
      limit_req zone=uploads burst=20 nodelay;
      limit_req zone=uploads_ip burst=60 nodelay;
      rewrite ^/map/(.*)$ /$1 break;
      proxy_pass http://map-management:80;
    }

    location = /data-collection/upload {
      limit_req zone=uploads burst=20 nodelay;
      limit_req zone=uploads_ip burst=60 nodelay;
      rewrite ^/data-collection/(.*)$ /$1 break;
      proxy_pass http://data-collection:80;
    }

    location /map/ {
      rewrite ^/map/(.*)$ /$1 break;
      proxy_pass http://map-management:80;
    }

    location /route/ {
      rewrite ^/route/(.*)$ /$1 break;
      proxy_pass http://route-management:80;
    }

    location /user/ {
      rewrite ^/user/(.*)$ /$1 break;
      proxy_pass http://user-management:80;
    }

    location /navigation/ {
      rewrite ^/navigation/(.*)$ /$1 break;
      proxy_pass http://navigation-management:80;
    }

    # Admin web app (Flutter web, built with --base-href /admin/ into
    # gateway/admin-web). Same origin as the API, so no CORS is needed.
    location = /admin {
      return 301 /admin/;
    }

    location /admin/ {
      # The web app's own files: many at once on first load.
      limit_req zone=static burst=200 nodelay;
      alias /usr/share/nginx/admin/;
      try_files $uri $uri/ /admin/index.html;
      # Checked on every load (an unchanged file answers 304), so a new
      # build shows on the next load instead of a cached old one.
      add_header Cache-Control "no-cache" always;
    }

    # Flutter's service worker kept serving an old admin app after a deploy.
    # The app no longer registers one (application/web/flutter_bootstrap.js),
    # and a browser that still has it fetches this when checking for an
    # update: it clears its caches, unregisters, and reloads the app's tabs
    # once. Served from here, so no build can bring the old worker back.
    location = /admin/flutter_service_worker.js {
      default_type application/javascript;
      add_header Cache-Control "no-cache" always;
      return 200 'self.addEventListener("install", () => self.skipWaiting());
self.addEventListener("activate", (event) => event.waitUntil((async () => {
  for (const key of await caches.keys()) await caches.delete(key);
  await self.registration.unregister();
  for (const client of await self.clients.matchAll({ type: "window" })) client.navigate(client.url);
})()));
';
    }

    # Only backend-positioning searches photos, and it calls ai-training
    # directly on the internal network. Through the gateway this endpoint
    # was public: anyone could spend the model's CPU and read anchor
    # coordinates.
    location = /ai-training/search_similar {
      return 404;
    }

    location /ai-training/ {
      rewrite ^/ai-training/(.*)$ /$1 break;
      proxy_pass http://ai-training:80;
    }

    location /positioning/ {
      limit_req zone=positioning burst=10 nodelay;
      limit_req zone=positioning_ip burst=120 nodelay;
      rewrite ^/positioning/(.*)$ /$1 break;
      proxy_pass http://positioning:80;
    }
  }
}
