events {}

http {
  # For the admin web app's files (.js, .wasm, .json...) under /admin/.
  include /etc/nginx/mime.types;

  # Photo uploads (anchor photos, navigation frames) - nginx's default 1 MB
  # would refuse anything above a medium-resolution camera frame.
  client_max_body_size 15m;

  server {
    listen 80;

    location = / {
      default_type application/json;
      return 200 '{"gateway":"ok"}';
    }

    location /data-collection/ {
      rewrite ^/data-collection/(.*)$ /$1 break;
      proxy_pass http://data-collection:80;
    }

    location /map/ {
      rewrite ^/map/(.*)$ /$1 break;
      proxy_pass http://map-management:80;
    }

    location /route/ {
      rewrite ^/route/(.*)$ /$1 break;
      proxy_pass http://route-management:80;
    }

    location /user/ {
      rewrite ^/user/(.*)$ /$1 break;
      proxy_pass http://user-management:80;
    }

    location /navigation/ {
      rewrite ^/navigation/(.*)$ /$1 break;
      proxy_pass http://navigation-management:80;
    }

    # Admin web app (Flutter web, built with --base-href /admin/ into
    # gateway/admin-web). Same origin as the API, so no CORS is needed.
    location = /admin {
      return 301 /admin/;
    }

    location /admin/ {
      alias /usr/share/nginx/admin/;
      try_files $uri $uri/ /admin/index.html;
    }

    # Only backend-positioning searches photos, and it calls ai-training
    # directly on the internal network. Through the gateway this endpoint
    # was public: anyone could spend the model's CPU and read anchor
    # coordinates.
    location = /ai-training/search_similar {
      return 404;
    }

    location /ai-training/ {
      rewrite ^/ai-training/(.*)$ /$1 break;
      proxy_pass http://ai-training:80;
    }

    location /positioning/ {
      rewrite ^/positioning/(.*)$ /$1 break;
      proxy_pass http://positioning:80;
    }
  }
}
