[project]
name = "backend-positioning"
version = "0.1.0"
description = "GPS positioning correction: fuses raw GPS with a visual anchor-point match via an Unscented Kalman Filter."
readme = "README.md"
authors = [
    { name = "MiguelCock", email = "maiguec999@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "filterpy>=1.4.5",
    "httpx>=0.28.1",
    "numpy>=2.3.4",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.6",
]

[tool.ruff.lint.flake8-bugbear]
# `File(...)`/`Form(...)` as defaults are FastAPI's standard DI pattern, not a
# real mutable-default bug (B008) - ruff only exempts `fastapi.Depends` by default.
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
